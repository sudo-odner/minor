syntax = "proto3";

package community.v1;

option go_package = "github.com/sudo-odner/minor/backend/shared/pkg/pb/community/v1;communityv1";

service CommunityService {
  rpc FetchPermission(FetchPermissionRequest) returns (FetchPermissionResponse);
}

message FetchPermissionRequest {
  string user_id = 1;
  string channel_id = 2;
}

message FetchPermissionResponse {
  uint64 permission_mask = 1;
}
