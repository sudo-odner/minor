services:
  traefik:
    image: "traefik:v3.0"
    container_name: traefik_gateway
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80" # пyбличный HTTP
      - "8080:8080" # для Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: unless-stopped
    command: "-js --store-dir=/data -m 8222"
    ports:
      - "4222:4222" #Порт для подключения клиентов
      - "8222:8222" #Порт для мониторинга
    volumes:
      - ./volumes/nats_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  cassandra:
    image: cassandra:4.1
    container_name: cassandra-db
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: "MessangerCluster"
      MAX_HEAP_SIZE: "1G"
      HEAP_NEWSIZE: "256M"
    ports:
      - "9042:9042"
    volumes:
      - ./volumes/cassandra_data:/var/lib/cassandra
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh -u cassandra -p cassandra -e 'describe cluster' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  message-service-migrator:
    build:
      context: ../backend/services/message_service
      dockerfile: migrator.Dockerfile
    container_name: message-service-migrator
    environment:
      - CASSANDRA_HOSTS=cassandra-db
    networks:
      - app-network
    depends_on:
      cassandra:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: discord_core
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_admin -d discord_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  # auth_service:
  #   build:
  #     context: ../backend/auth_service
  #     dockerfile: Dockerfile
