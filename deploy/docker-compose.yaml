services:
  # API Gateway
  traefik:
    image: "traefik:v3.0"
    container_name: traefik-gateway
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80" # пyбличный HTTP
      - "8080:8080" # для Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - minor-network

  # NATS
  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222" #Порт для подключения клиентов
      - "8222:8222" #Порт для мониторинга
    volumes:
      - ./volumes/nats_data:/data
    networks:
      - minor-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # REDIS
  redis:
    image: redis:7.2-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis_data:/data
    networks:
      - minor-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # CASSANDRA
  cassandra:
    image: cassandra:4.1
    container_name: cassandra-db
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: "MessangerCluster"
      MAX_HEAP_SIZE: "1G"
      HEAP_NEWSIZE: "256M"
    ports:
      - "9042:9042"
    volumes:
      - ./volumes/cassandra_data:/var/lib/cassandra
    networks:
      - minor-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh -u cassandra -p cassandra -e 'describe cluster' || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  message-cassandra-migrator:
    build:
      context: ../backend/services/message_service
      dockerfile: migrator.Dockerfile
    container_name: message-service-migrator
    environment:
      - CASSANDRA_HOSTS=cassandra-db
    networks:
      - minor-network
    depends_on:
      cassandra:
        condition: service_healthy

  # POSTGRES
  auth-postgres:
    image: postgres:15-alpine
    container_name: auth-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: discord_core
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres_data/auth:/var/lib/postgresql/data
    networks:
      - minor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_admin -d discord_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-postgres:
    image: postgres:15-alpine
    container_name: user-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service_master_key
      POSTGRES_DB: user_service
    ports:
      - "5484:5432"
    volumes:
      - ./volumes/postgres_data/user:/var/lib/postgresql/data
    networks:
      - minor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_admin -d discord_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-migrator:
    image: migrate/migrate:v4.17.1
    container_name: user-migrator
    volumes:
      - ../backend/services/user_service/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://user_service:user_service_master_key@user-postgres:5484/user_service?sslmode=disable
      - up
    networks:
      - minor-network
    depends_on:
      community-postgres:
        condition: service_healthy

  community-postgres:
    image: postgres:15-alpine
    container_name: community-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: community_service
      POSTGRES_PASSWORD: community_service_master_key
      POSTGRES_DB: community_service
    ports:
      - "5483:5432"
    volumes:
      - ./volumes/postgres_data/community:/var/lib/postgresql/data
    networks:
      - minor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_admin -d discord_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  community-migrator:
    image: migrate/migrate:v4.17.1
    container_name: community-migrator
    volumes:
      - ../backend/services/community_service/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://community_service:community_service_master_key@community-postgres:5483/community_service?sslmode=disable
      - up
    networks:
      - minor-network
    depends_on:
      community-postgres:
        condition: service_healthy

